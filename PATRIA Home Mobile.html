 clasico:{n:'El Clásico de Siempre',img:'assets/clasico.png',d:'Dos tapas de chocolate negro, dulce de leche espeso en el medio y cobertura entera. El de siempre.',dots:['dulce','chocolate']},

function PedirEste({name,tone='light',style}){
  return <a href={wa('¡Hola PATRIA! Quiero pedir '+name+'. ¿Me pasan disponibilidad?')} className="waminor" style={tone==='dark'?{color:'var(--cream-100)',borderColor:'rgba(247,241,230,.45)',...style}:style}><WA size={13}/> Pedir este</a>;

function PriceRow({name,tone='light',style}){

  );

function Reveal({children,style,delay=0}){
  const ref=React.useRef(null);
  React.useEffect(()=>{const el=ref.current;if(!el)return;
    const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){setTimeout(()=>el.classList.add('in'),delay);io.disconnect();}},{threshold:.06});
    io.observe(el);const t=setTimeout(()=>el.classList.add('in'),1800);
    return()=>{io.disconnect();clearTimeout(t);};},[]);
  return <div ref={ref} className="reveal" style={style}>{children}</div>;
}

function Header({lang,setLang}){
  const [solid,setSolid]=React.useState(false);
  React.useEffect(()=>{const f=()=>setSolid(window.scrollY>520);window.addEventListener('scroll',f,{passive:true});return()=>window.removeEventListener('scroll',f);},[]);
  const ink=solid?'var(--celeste-700)':'var(--cream-50)';
  return (
    <header style={{position:'fixed',insetBlockStart:0,insetInline:0,margin:'0 auto',width:'390px',maxWidth:'100%',zIndex:30,display:'flex',alignItems:'center',gap:'10px',padding:'12px 22px',
      background:solid?'rgba(247,241,230,.95)':'linear-gradient(to bottom,rgba(20,10,4,.5),rgba(20,10,4,0))',
      borderBlockEnd:solid?'1px solid var(--border-hairline)':'1px solid transparent',transition:'background .3s var(--ease-standard),border-color .3s'}}>
      <img src="assets/logo-emblem-color.jpg" alt="" width="30" height="30" style={{borderRadius:'50%',border:'1px solid rgba(255,255,255,.35)',opacity:solid?1:.96}}/>
      <span style={{fontFamily:'var(--font-display)',fontSize:'18px',fontWeight:700,letterSpacing:'.16em',color:ink,transition:'color .3s'}}>PATRIA</span>
      <div style={{marginInlineStart:'auto'}}>
        <LangSwitch lang={lang} onChange={setLang} style={{borderColor:solid?'var(--border-hairline)':'rgba(247,241,230,.4)',background:solid?'transparent':'rgba(20,10,4,.25)'}}/>
      </div>
    </header>
  );
}

        ))}
      </div>
      <div style={{marginBlockStart:'34px'}}>
        <div className="px" style={{fontFamily:'var(--font-label)',fontSize:'10.5px',letterSpacing:'.22em',textTransform:'uppercase',color:'var(--choc-600)',paddingBlockEnd:'10px'}}>Desde Instagram</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'3px'}}>
          {[1,2,3].map(n=><div key={n} className="ph" style={{aspectRatio:'1 / 1',display:'grid',placeItems:'center',fontSize:'9.5px',letterSpacing:'.08em',border:'1px dashed rgba(74,42,23,.26)'}}>Post real</div>)}
        </div>
      </div>
    </section>
  );
}

function Pedido(){
  return (
    <section style={{paddingBlock:'52px 46px'}} className="px">
      <Eyebrow>Cómo se pide</Eyebrow>
      <h2 style={{fontSize:'30px',fontWeight:600,lineHeight:1.04,marginBlockStart:'12px'}}>Tres mensajes<br/>y listo.</h2>
      <div style={{marginBlockStart:'26px'}}>
        {[['Elegí tus sabores','Media docena surtida o todos del mismo. Vos decidís.'],['Escribinos por WhatsApp','Mandás el pedido en un mensaje; te confirmamos disponibilidad.'],['Coordinamos la entrega','Acordamos día y forma antes de que pagues nada.']].map(([t,d],i)=>(
          <div key={t} style={{display:'flex',gap:'18px',alignItems:'baseline',paddingBlock:'16px',borderBlockStart:'1px solid var(--border-hairline)'}}>
            <span style={{fontFamily:'var(--font-display)',fontSize:'28px',fontWeight:600,color:'var(--dulce-500)',lineHeight:1}}>{i+1}</span>
            <div>
              <div style={{fontFamily:'var(--font-display)',fontSize:'21px',fontWeight:600,color:'var(--text-strong)'}}>{t}</div>
              <div style={{fontSize:'15px',color:'var(--text-muted)',lineHeight:1.5,marginBlockStart:'2px'}}>{d}</div>
            </div>
          </div>
        ))}
      </div>
      <div className="ph" style={{textAlign:'start',lineHeight:1.8,marginBlockStart:'22px',letterSpacing:'.1em'}}>Zonas de entrega · mínimo · tiempos · precios — a confirmar</div>
    </section>
  );
}

function CTA(){
  return (
    <section id="pedir">
      <div style={{position:'relative'}}>
      <img src="assets/frutos-rojos.png" alt="Alfajor de frutos rojos cortado" style={{width:'100%',aspectRatio:'1 / 1',objectFit:'cover',objectPosition:'40% 55%'}}/>
      <div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(18,9,3,.92) 8%,rgba(18,9,3,.1) 58%,rgba(18,9,3,0) 80%)'}}/>
      <div style={{position:'absolute',insetInline:'22px',insetBlockEnd:'26px'}}>
        <h2 style={{fontSize:'34px',fontWeight:600,color:'var(--cream-50)',lineHeight:1.02}}>¿Te tentaste?</h2>
        <p style={{margin:'12px 0 0',fontSize:'15.5px',color:'var(--cream-200)',maxWidth:'28ch'}}>Escribinos por WhatsApp y armamos tu pedido. Contestamos nosotros.</p>
      </div>
      </div>
      <div style={{background:'var(--choc-800)',padding:'24px 22px 32px',display:'grid',gap:'14px'}}>
        <a href={wa('¡Hola PATRIA! Quiero hacer un pedido.')} className="wabtn cream" style={{width:'100%'}}><WA/> Hacer mi pedido</a>
        <div className="ph" style={{justifySelf:'start',borderColor:'rgba(247,241,230,.28)',color:'var(--text-on-ink-muted)',padding:'8px 12px',fontSize:'10px'}}>Número de WhatsApp — a insertar</div>
      </div>
    </section>
  );
}

function Pie(){
  return (
    <footer>
      <div className="px" style={{paddingBlock:'40px 34px',display:'grid',gap:'10px'}}>
        <Eyebrow tone="blue">Instagram</Eyebrow>
        <p style={{margin:0,fontSize:'17px',color:'var(--choc-700)',fontFamily:'var(--font-display)',lineHeight:1.3,maxWidth:'26ch'}}>Cada tanda nueva, primero la mostramos ahí.</p>
        <a href="#" style={{fontFamily:'var(--font-label)',fontSize:'13px',fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',borderBottom:'1px solid currentColor',justifySelf:'start',marginBlockStart:'4px'}}>Seguinos</a>
      </div>
      <div style={{borderBlockStart:'1px solid var(--border-hairline)',padding:'18px 22px 76px',display:'flex',alignItems:'center',gap:'12px'}}>
        <Seal size={38} src="assets/logo-seal-cream.jpg" rotate={0} shadow={false}/>
        <span style={{fontFamily:'var(--font-label)',fontSize:'10px',letterSpacing:'.16em',textTransform:'uppercase',color:'var(--text-muted)',whiteSpace:'nowrap'}}>PATRIA · Orgullo argentino</span>
      </div>
    </footer>
  );
}

function FloatWA(){
  const [show,setShow]=React.useState(false);
  React.useEffect(()=>{
    const f=()=>{
      const cta=document.getElementById('pedir');
      const near=cta?cta.getBoundingClientRect().top<window.innerHeight-60:false;
      setShow(window.scrollY>860&&!near);
    };
    f();window.addEventListener('scroll',f,{passive:true});return()=>window.removeEventListener('scroll',f);},[]);
  return (
    <a href={wa('¡Hola PATRIA! Quiero hacer un pedido.')} aria-label="Pedir por WhatsApp" style={{position:'fixed',insetBlockEnd:'18px',insetInlineEnd:'calc(50% - 195px + 18px)',zIndex:25,display:'inline-flex',alignItems:'center',gap:'9px',
      background:'var(--choc-700)',color:'var(--cream-50)',padding:'12px 18px',borderRadius:'var(--radius-pill)',boxShadow:'var(--shadow-md)',border:'1px solid rgba(247,241,230,.18)',
      fontFamily:'var(--font-label)',fontSize:'12px',fontWeight:700,letterSpacing:'.14em',textTransform:'uppercase',
      opacity:show?1:0,transform:show?'none':'translateY(10px)',pointerEvents:show?'auto':'none',transition:'opacity .3s var(--ease-standard),transform .3s var(--ease-standard)'}}>
      <WA size={15}/> Pedir
    </a>
  );
}

function App(){
  const [lang,setLang]=React.useState('es');
  return (
    <div>
      <Header lang={lang} setLang={setLang}/>
      <Hero/>
      <InfoStrip/>
      <Manifiesto/>
      <Destacados/>
      <Historia/>
      <Artesanal/>
      <Prueba/>
      <PrimeraVez/>
      <Pedido/>
      <CTA/>
      <Pie/>
      <FloatWA/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
